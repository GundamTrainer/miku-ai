<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GundamTrainer AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Share+Tech+Mono&display=swap');
  :root{--teal:#39c5bb;--pink:#ff69b4;--dark:#0a0e1a;--darker:#060810;--glow:rgba(57,197,187,0.4);--panel:rgba(10,20,40,0.85);--main:#e0f7f5;--dim:rgba(224,247,245,0.5)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--darker);color:var(--main);font-family:'Zen Kaku Gothic New',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 80%,rgba(57,197,187,0.08) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 20% 20%,rgba(255,105,180,0.04) 0%,transparent 60%);pointer-events:none;z-index:0}
  header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid rgba(57,197,187,0.2);background:rgba(6,8,16,0.9);backdrop-filter:blur(12px)}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{width:32px;height:32px;border:2px solid var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--teal);animation:pulse 3s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--glow)}50%{box-shadow:0 0 20px var(--glow),0 0 40px rgba(57,197,187,0.2)}}
  .logo-text{font-size:18px;font-weight:700;letter-spacing:.1em;color:var(--teal);text-shadow:0 0 20px var(--glow)}
  .logo-sub{font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:.2em}
  .status-bar{display:flex;align-items:center;gap:16px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  main{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}
  #cv{flex:1;position:relative;overflow:hidden;background:var(--darker)}
  #cv canvas{display:block;width:100%!important;height:100%!important}
  #cv::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none}
  .corner{position:absolute;width:20px;height:20px;z-index:5;pointer-events:none}
  .corner.tl{top:12px;left:12px;border-top:2px solid var(--teal);border-left:2px solid var(--teal)}
  .corner.tr{top:12px;right:12px;border-top:2px solid var(--teal);border-right:2px solid var(--teal)}
  .corner.bl{bottom:12px;left:12px;border-bottom:2px solid var(--teal);border-left:2px solid var(--teal)}
  .corner.br{bottom:12px;right:12px;border-bottom:2px solid var(--teal);border-right:2px solid var(--teal)}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--darker);z-index:20;gap:20px;transition:opacity .8s}
  #loading.hidden{opacity:0;pointer-events:none}
  .ring{width:60px;height:60px;border:2px solid rgba(57,197,187,.2);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lt{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--teal);letter-spacing:.3em}
  #prog{font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:.2em}
  #panel{width:360px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid rgba(57,197,187,.15);backdrop-filter:blur(16px)}
  .ph{padding:16px 20px;border-bottom:1px solid rgba(57,197,187,.1);display:flex;align-items:center;gap:10px}
  .pt{font-size:12px;letter-spacing:.25em;color:var(--teal);font-family:'Share Tech Mono',monospace;text-transform:uppercase}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(57,197,187,.3) transparent}
  .msg{display:flex;flex-direction:column;gap:4px;animation:mi .3s ease}
  @keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.u{align-items:flex-end}.msg.m{align-items:flex-start}
  .ml{font-size:9px;letter-spacing:.2em;color:var(--dim);font-family:'Share Tech Mono',monospace}
  .mb{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
  .msg.u .mb{background:rgba(57,197,187,.15);border:1px solid rgba(57,197,187,.3);border-bottom-right-radius:2px}
  .msg.m .mb{background:rgba(255,105,180,.08);border:1px solid rgba(255,105,180,.2);border-bottom-left-radius:2px}
  .ti{display:flex;gap:4px;padding:8px 0;align-items:center}
  .ti span{width:5px;height:5px;background:var(--pink);border-radius:50%;animation:bd 1.2s infinite}
  .ti span:nth-child(2){animation-delay:.2s}.ti span:nth-child(3){animation-delay:.4s}
  @keyframes bd{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
  #ctrl{padding:16px;border-top:1px solid rgba(57,197,187,.1);display:flex;flex-direction:column;gap:10px}
  #tir{display:flex;gap:8px}
  #ti{flex:1;background:rgba(57,197,187,.06);border:1px solid rgba(57,197,187,.2);border-radius:8px;padding:10px 14px;color:var(--main);font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
  #ti:focus{border-color:var(--teal);box-shadow:0 0 12px rgba(57,197,187,.15)}
  #ti::placeholder{color:var(--dim)}
  .btn{border:none;border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.1em;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
  #sb{padding:10px 16px;background:var(--teal);color:var(--dark);font-weight:bold}
  #sb:hover{background:#4dd9cf;box-shadow:0 0 16px rgba(57,197,187,.5)}
  #mb2{padding:12px 20px;background:rgba(255,105,180,.1);border:1px solid rgba(255,105,180,.3);color:var(--pink);font-size:13px}
  #mb2:hover{background:rgba(255,105,180,.2);box-shadow:0 0 16px rgba(255,105,180,.3)}
  #mb2.on{background:var(--pink);color:#fff;box-shadow:0 0 20px rgba(255,105,180,.6);animation:mp 1s infinite}
  @keyframes mp{0%,100%{box-shadow:0 0 16px rgba(255,105,180,.5)}50%{box-shadow:0 0 30px rgba(255,105,180,.9)}}
  .mh{text-align:center;font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:.15em}
  #aks{padding:12px;background:rgba(255,180,0,.06);border:1px solid rgba(255,180,0,.2);border-radius:8px}
  #akl{font-size:9px;color:rgba(255,180,0,.7);letter-spacing:.2em;font-family:'Share Tech Mono',monospace;margin-bottom:6px}
  #akr{display:flex;gap:6px}
  #aki{flex:1;background:rgba(255,180,0,.05);border:1px solid rgba(255,180,0,.2);border-radius:6px;padding:7px 10px;color:var(--main);font-family:'Share Tech Mono',monospace;font-size:11px;outline:none}
  #aksv{padding:7px 12px;background:rgba(255,180,0,.15);border:1px solid rgba(255,180,0,.3);color:rgba(255,200,0,.9);font-size:10px;border-radius:6px;cursor:pointer;font-family:'Share Tech Mono',monospace}
  #msr{display:flex;gap:6px}
  .mb3{flex:1;padding:7px;background:rgba(57,197,187,.05);border:1px solid rgba(57,197,187,.15);color:var(--dim);font-size:10px;border-radius:6px;cursor:pointer;transition:all .2s;font-family:'Share Tech Mono',monospace}
  .mb3.active{background:rgba(57,197,187,.15);border-color:var(--teal);color:var(--teal)}
  #ed{display:flex;gap:6px;align-items:center;padding:8px 12px;background:rgba(57,197,187,.04);border:1px solid rgba(57,197,187,.1);border-radius:8px}
  #el{font-size:9px;color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:.15em;flex:1}
  #ev{font-size:11px;color:var(--teal);font-family:'Share Tech Mono',monospace}
  #msgs::-webkit-scrollbar{width:3px}
  #msgs::-webkit-scrollbar-track{background:transparent}
  #msgs::-webkit-scrollbar-thumb{background:rgba(57,197,187,.3);border-radius:3px}
</style>

<header>
  <div class="logo">
    <div class="logo-mark">GT</div>
    <div>
      <div class="logo-text">GundamTrainer AI</div>
      <div class="logo-sub">MIKU INTERFACE v1.02</div>
    </div>
  </div>
  <div class="status-bar">
    <div class="dot"></div>
    <span id="st">INITIALIZING</span>
  </div>
</header>
<main>
  <div id="cv">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="loading">
      <div class="ring"></div>
      <div class="lt">LOADING MIKU</div>
      <div id="prog">준비 중...</div>
    </div>
  </div>
  <div id="panel">
    <div class="ph"><div class="dot"></div><div class="pt">DIALOGUE SYSTEM</div></div>
    <div id="msgs">
      <div class="msg m"><div class="ml">MIKU</div><div class="mb">안녕! 나는 미쿠야! 뭐든지 말 걸어줘! 🎵</div></div>
    </div>

<script type="module">
import * as THREE from 'three';
import { MMDLoader } from 'three/addons/loaders/MMDLoader.js';

// ── 상태 ──
let KEY='', curModel='Black', scene, cam, renderer, mesh, clock;
let speaking=false, listening=false, recog=null, animId=null, lipT=0;

const EMOTIONS={
  happy:{e:'😊',m:{'にっこり':.8}},
  sad:{e:'😢',m:{'困る':.7}},
  angry:{e:'😠',m:{'怒り':.8}},
  surprised:{e:'😲',m:{'驚き':.9}},
  neutral:{e:'😐',m:{}}
};
const VOWELS=['あ','い','う','え','お'];

// ── Three.js 초기화 ──
function init3D(){
  const c=document.getElementById('cv');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0e1a);
  scene.fog=new THREE.FogExp2(0x0a0e1a,.015);

  scene.add(new THREE.AmbientLight(0x8899bb,1.2));
  const d=new THREE.DirectionalLight(0x39c5bb,1.5); d.position.set(1,3,3); scene.add(d);
  const r=new THREE.DirectionalLight(0xff69b4,.5); r.position.set(-3,1,-2); scene.add(r);
  const f=new THREE.DirectionalLight(0xffffff,.4); f.position.set(0,-1,2); scene.add(f);

  cam=new THREE.PerspectiveCamera(25,c.clientWidth/c.clientHeight,.1,500);
  cam.position.set(0,18,30); cam.lookAt(0,12,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  c.appendChild(renderer.domElement);

  clock=new THREE.Clock();
  window.addEventListener('resize',()=>{
    cam.aspect=c.clientWidth/c.clientHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(c.clientWidth,c.clientHeight);
  });
}

// ── MMD 로드 ──
function loadMiku(){
  document.getElementById('prog').textContent=`${curModel}.pmx 로딩 중...`;
  const loader=new MMDLoader();
  loader.load(
    `./${curModel}.pmx`,
    obj=>{
      if(mesh){scene.remove(mesh);mesh=null;}
      mesh=obj;
      mesh.scale.setScalar(0.085);
      mesh.position.set(0,0,0);
      scene.add(mesh);
      // 카메라 자동 맞춤
      const box=new THREE.Box3().setFromObject(mesh);
      const cen=box.getCenter(new THREE.Vector3());
      const sz=box.getSize(new THREE.Vector3());
      const md=Math.max(sz.x,sz.y,sz.z);
      cam.position.set(cen.x,cen.y+md*.3,cen.z+md*2);
      cam.lookAt(cen.x,cen.y,cen.z);
      hideLoading();
      document.getElementById('st').textContent='ONLINE';
      startLoop();
    },
    xhr=>{if(xhr.total>0)document.getElementById('prog').textContent=Math.round(xhr.loaded/xhr.total*100)+'%';},
    err=>{console.warn(err);fallback();}
  );
}

// ── 애니메이션 루프 ──
function startLoop(){
  if(animId)cancelAnimationFrame(animId);
  const loop=()=>{
    animId=requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    if(mesh){
      mesh.rotation.y=Math.sin(t*.4)*.05;
      mesh.position.y=Math.sin(t*.6)*.1;
      // 입 움직임
      if(speaking){
        lipT+=.3;
        const v=Math.abs(Math.sin(lipT*3))*.6;
        VOWELS.forEach(m=>setMorph(m,0));
        setMorph(VOWELS[Math.floor(lipT)%VOWELS.length],v);
      } else {
        VOWELS.forEach(m=>setMorph(m,0));
      }
      // 눈 깜빡임
      const bf=Math.floor(t*10)%50;
      setMorph('まばたき',bf<3?1:0);
    }
    renderer.render(scene,cam);
  };
  loop();
}

// ── 모프 설정 ──
function setMorph(name,val){
  if(!mesh)return;
  mesh.traverse(c=>{
    if(c.isMesh&&c.morphTargetDictionary){
      const i=c.morphTargetDictionary[name];
      if(i!==undefined&&c.morphTargetInfluences)
        c.morphTargetInfluences[i]=Math.max(0,Math.min(1,val));
    }
  });
}

function applyEmotion(key){
  const e=EMOTIONS[key]||EMOTIONS.neutral;
  document.getElementById('ev').textContent=`${e.e} ${key.toUpperCase()}`;
  Object.keys(EMOTIONS).flatMap(k=>Object.keys(EMOTIONS[k].m)).forEach(m=>setMorph(m,0));
  Object.entries(e.m).forEach(([m,v])=>setMorph(m,v));
}

// ── 폴백 (파티클) ──
function fallback(){
  hideLoading();
  document.getElementById('st').textContent='UI ONLINE';
  // 파티클
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(600*3);
  for(let i=0;i<pos.length;i++)pos[i]=(Math.random()-.5)*40;
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x39c5bb,size:.08,transparent:true,opacity:.5}));
  scene.add(pts);
  const loop=()=>{animId=requestAnimationFrame(loop);pts.rotation.y=clock.getElapsedTime()*.05;renderer.render(scene,cam);};
  loop();
  addMsg('s','⚠ 3D 모델 로드 실패\nGitHub에 Black.pmx, White.pmx 파일이\n있는지 확인해주세요!\n\nAI 대화는 정상 작동해요 🎵');
}

function hideLoading(){
  const el=document.getElementById('loading');
  el.classList.add('hidden');
  setTimeout(()=>el.style.display='none',900);
}

// ── 모델 전환 ──
window.switchModel=function(name){
  curModel=name;
  document.getElementById('bb').classList.toggle('active',name==='Black');
  document.getElementById('wb').classList.toggle('active',name==='White');
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(mesh){scene.remove(mesh);mesh=null;}
  const ld=document.getElementById('loading');
  ld.style.display='flex';ld.classList.remove('hidden');
  loadMiku();
};

// ── 채팅 UI ──
function addMsg(role,text){
  const box=document.getElementById('msgs');
  const d=document.createElement('div');
  if(role==='s'){
    d.className='msg m';
    d.innerHTML=`<div class="ml">SYSTEM</div><div class="mb" style="border-color:rgba(255,180,0,.3);background:rgba(255,180,0,.06);white-space:pre-line">${text}</div>`;
  } else if(role==='u'){
    d.className='msg u';
    d.innerHTML=`<div class="ml">YOU</div><div class="mb">${text}</div>`;
  } else {
    d.className='msg m';
    d.innerHTML=`<div class="ml">MIKU</div><div class="mb">${text}</div>`;
  }
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

function showTyping(){
  const box=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg m';d.id='tb';
  d.innerHTML='<div class="ml">MIKU</div><div class="mb"><div class="ti"><span></span><span></span><span></span></div></div>';
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function rmTyping(){const e=document.getElementById('tb');if(e)e.remove();}

// ── API 키 ──
window.saveKey=function(){
  const v=document.getElementById('aki').value.trim();
  if(!v)return;
  KEY=v;
  document.getElementById('aks').style.borderColor='rgba(57,197,187,.4)';
  document.getElementById('akl').textContent='✓ API KEY SAVED';
  document.getElementById('akl').style.color='rgba(57,197,187,.8)';
  addMsg('s','API 키 저장 완료! 이제 미쿠와 대화해봐요 🎵');
};

// ── Gemini 호출 ──
async function gemini(text){
  if(!KEY)return'먼저 API 키를 입력해주세요!';
  const sys=`너는 하츠네 미쿠야. 귀엽고 밝은 버추얼 아이돌이야.
반드시 한국어로만 대답해. 일본어 절대 쓰지마.
짧고 친근하게 말해. 이모지 가끔 써.
답변 끝에 반드시 [EMOTION:happy] [EMOTION:sad] [EMOTION:angry] [EMOTION:surprised] [EMOTION:neutral] 중 하나 붙여.`;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${KEY}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:`${sys}\n\n사용자: ${text}`}]}]})
    });
    if(!r.ok){const e=await r.json();return`오류: ${e.error?.message||'unknown'}`;}
    const data=await r.json();
    let rep=data.candidates?.[0]?.content?.parts?.[0]?.text||'...';
    const m=rep.match(/\[EMOTION:(\w+)\]/);
    if(m){applyEmotion(m[1]);rep=rep.replace(/\[EMOTION:\w+\]/g,'').trim();}
    return rep;
  }catch(e){return`연결 오류: ${e.message}`;}
}

// ── 메시지 전송 ──
window.send=async function(t){
  const inp=document.getElementById('ti');
  const msg=t||inp.value.trim();
  if(!msg)return;
  inp.value='';
  addMsg('u',msg);showTyping();
  const rep=await gemini(msg);
  rmTyping();addMsg('m',rep);speak(rep);
};

// ── TTS 한국어 ──
function speak(text){
  if(!speechSynthesis)return;
  const clean=text.replace(/[\u{1F300}-\u{1FFFF}]/gu,'').replace(/[\u3000-\u9fff]/g,'').replace(/[♪♫★☆]/g,'').trim();
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang==='ko-KR'&&/female|yuna/i.test(v.name))||vs.find(v=>v.lang==='ko-KR')||vs.find(v=>v.lang.startsWith('ko'));
  if(v)u.voice=v;
  u.lang='ko-KR';u.pitch=1.4;u.rate=1.05;
  u.onstart=()=>{speaking=true;lipT=0;};
  u.onend=()=>{speaking=false;VOWELS.forEach(m=>setMorph(m,0));};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

// ── STT ──
window.toggleMic=function(){
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){alert('Chrome을 써주세요!');return;}
  if(listening){recog?.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();recog.lang='ko-KR';recog.interimResults=true;recog.continuous=false;
  const btn=document.getElementById('mb2'),hint=document.getElementById('mh');
  recog.onstart=()=>{listening=true;btn.classList.add('on');btn.textContent='🔴 듣는 중...';hint.textContent='말이 끝나면 자동 전송';};
  recog.onresult=e=>{document.getElementById('ti').value=Array.from(e.results).map(r=>r[0].transcript).join('');};
  recog.onend=()=>{
    listening=false;btn.classList.remove('on');btn.textContent='🎤 마이크로 말하기';hint.textContent='클릭하면 음성인식 시작';
    const v=document.getElementById('ti').value.trim();if(v)window.send(v);
  };
  recog.onerror=e=>{listening=false;btn.classList.remove('on');btn.textContent='🎤 마이크로 말하기';if(e.error==='not-allowed')hint.textContent='마이크 권한을 허용해주세요!';};
  recog.start();
};

// ── 시작 ──
init3D();
loadMiku();
if(speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
</script>
</body>
