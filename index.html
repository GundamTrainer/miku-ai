<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatsune Miku White Ver. - 500 Procedural Motions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #141414;
            color: #fff;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #39c5bb;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            line-height: 1.6;
        }
        #behavior-name {
            color: #39c5bb;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
    <!-- Three.js 및 OrbitControls 엔진 빌드 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <div style="font-weight: bold; margin-bottom: 5px; font-size: 16px;">하츠네 미쿠 (White Ver.)</div>
        <div>실시간 행동 패턴: <span id="behavior-name">데이터 로딩 중...</span></div>
        <div style="color: #aaa; font-size: 12px; margin-top: 5px;">※ 3초마다 500가지의 유니크한 절차적 모션이 무작위로 활성화됩니다.</div>
    </div>

    <script>
        // --- 1. 글로벌 무대 인프라 구축 (Scene, Camera, Renderer) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141414);
        scene.fog = new THREE.FogExp2(0x141414, 0.12);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.4, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 최적화 가이드라인 적용
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 시점 제어기 설정 (마우스 핸들링 메커니즘)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.9, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 바닥을 뚫고 내려가지 않도록 잠금

        // --- 2. 조명 및 환경 설계 (Lights & Stage Ground) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // 무대 그림자 리시버 바닥
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(20, 20, 0x39c5bb, 0x333333);
        grid.position.y = 0.005;
        scene.add(grid);

        // --- 3. 미쿠 모델링 엔진 (White Ver. 정밀 수리 사양) ---
        function createMikuWhite() {
            const mikuGroup = new THREE.Group();

            // 테마 머티리얼 에셋 정의
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe2d4, roughness: 0.55 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x39c5bb, roughness: 0.45 });
            const accentMat = new THREE.MeshStandardMaterial({ color: 0x2fa8a0, roughness: 0.4 });

            // 몸통(Torso) - 계층형 구조의 최상위 루트 노드
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.11, 0.48, 16), whiteMat);
            torso.position.y = 0.9; 
            torso.castShadow = true;
            torso.receiveShadow = true;
            mikuGroup.add(torso);

            // 머리(Head)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skinMat);
            head.position.y = 0.36;
            head.castShadow = true;
            torso.add(head);

            // 시그니처 트윈테일 (좌/우 피벗 분리 분기)
            const hairLeftPivot = new THREE.Group();
            hairLeftPivot.position.set(-0.13, 0.06, -0.04);
            head.add(hairLeftPivot);
            const hairLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.008, 0.58, 8), hairMat);
            hairLeft.position.y = -0.26;
            hairLeft.rotation.z = Math.PI / 10;
            hairLeftPivot.add(hairLeft);

            const hairRightPivot = new THREE.Group();
            hairRightPivot.position.set(0.13, 0.06, -0.04);
            head.add(hairRightPivot);
            const hairRight = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.008, 0.58, 8), hairMat);
            hairRight.position.y = -0.26;
            hairRight.rotation.z = -Math.PI / 10;
            hairRightPivot.add(hairRight);

            // [오른팔 레이어 분리 전면 수정] 몸통에 기하학적으로 완벽 밀착 결속 구조 설계
            const rShoulder = new THREE.Group();
            rShoulder.position.set(0.20, 0.16, 0); 
            torso.add(rShoulder);

            const rUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.22, 8), whiteMat); 
            rUpperArm.position.y = -0.11;
            rUpperArm.castShadow = true;
            rShoulder.add(rUpperArm);

            const rElbow = new THREE.Group();
            rElbow.position.y = -0.11;
            rUpperArm.add(rElbow);

            const rLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.028, 0.22, 8), skinMat); 
            rLowerArm.position.y = -0.11;
            rLowerArm.castShadow = true;
            rElbow.add(rLowerArm);

            // 왼팔 레이어 대칭 설계
            const lShoulder = new THREE.Group();
            lShoulder.position.set(-0.20, 0.16, 0);
            torso.add(lShoulder);

            const lUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.22, 8), whiteMat);
            lUpperArm.position.y = -0.11;
            lUpperArm.castShadow = true;
            lShoulder.add(lUpperArm);

            const lElbow = new THREE.Group();
            lElbow.position.y = -0.11;
            lUpperArm.add(lElbow);

            const lLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.028, 0.22, 8), skinMat);
            lLowerArm.position.y = -0.11;
            lLowerArm.castShadow = true;
            lElbow.add(lLowerArm);

            // [요청 사항 반영] 다리 관절 모듈화 시스템 (고관절 - 무릎 이중 굽힘 축 구축)
            // 우측 하체 기동축
            const rHip = new THREE.Group();
            rHip.position.set(0.08, -0.24, 0);
            torso.add(rHip);

            const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.34, 8), whiteMat);
            rThigh.position.y = -0.17;
            rThigh.castShadow = true;
            rHip.add(rThigh);

            const rKnee = new THREE.Group();
            rKnee.position.y = -0.17;
            rThigh.add(rKnee);

            const rCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.038, 0.34, 8), accentMat); 
            rCalf.position.y = -0.17;
            rCalf.castShadow = true;
            rKnee.add(rCalf);

            // 좌측 하체 기동축
            const lHip = new THREE.Group();
            lHip.position.set(-0.08, -0.24, 0);
            torso.add(lHip);

            const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.34, 8), whiteMat);
            lThigh.position.y = -0.17;
            lThigh.castShadow = true;
            lHip.add(lThigh);

            const lKnee = new THREE.Group();
            lKnee.position.y = -0.17;
            lThigh.add(lKnee);

            const lCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.038, 0.34, 8), accentMat);
            lCalf.position.y = -0.17;
            lCalf.castShadow = true;
            lKnee.add(lCalf);

            return {
                mesh: mikuGroup,
                joints: {
                    torso, head, hairLeftPivot, hairRightPivot,
                    rShoulder, rElbow, lShoulder, lElbow,
                    rHip, rKnee, lHip, lKnee
                }
            };
        }

        const miku = createMikuWhite();
        scene.add(miku.mesh);

        // --- 4. 500가지 고유 모션 데이터 절차적 빌더 ---
        function generateProceduralBehaviors() {
            const db = [];
            const actionPool = ['squat_depth', 'natural_walk', 'dynamic_run', 'idol_dance', 'elegant_wave', 'rhythm_jump'];
            
            for (let i = 0; i < 500; i++) {
                const type = actionPool[i % actionPool.length];
                db.push({
                    id: i,
                    name: `${type.toUpperCase()} (모션 패턴 No.${String(i + 1).padStart(3, '0')})`,
                    type: type,
                    speed: 1.6 + Math.sin(i * 0.23) * 0.5,
                    armRange: 0.6 + (i % 6) * 0.14,  // 증폭된 상체 관절 가동 범위 적용
                    legRange: 0.5 + (i % 5) * 0.16,  // 실시간 다리 구부림 한계 확장 인자
                    phaseOffset: (i % 8) * (Math.PI / 4)
                });
            }
            return db;
        }

        const behaviorDatabase = generateProceduralBehaviors();
        let currentBehavior = behaviorDatabase[0];
        let stateTimer = 0;
        const uiText = document.getElementById('behavior-name');

        // --- 5. 실시간 애니메이션 루프 & 관통 제약 물리 공식 엔진 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            const j = miku.joints;
            const b = currentBehavior;
            const t = time * b.speed;

            // 상단 모션 텍스트 동적 동기화
            uiText.innerText = b.name;

            // 3초 단위 타이머 스위칭 메커니즘
            stateTimer += delta;
            if (stateTimer > 3.0) {
                currentBehavior = behaviorDatabase[Math.floor(Math.random() * 500)];
                stateTimer = 0;
            }

            // [초기화 가이드레일] 가동전 관절 회전 기본 베이스값 초기화 안정화
            j.torso.position.y = 0.9;
            j.torso.rotation.set(0, 0, 0);
            j.head.rotation.set(0, 0, 0);
            j.rShoulder.rotation.set(0, 0, 0);
            j.lShoulder.rotation.set(0, 0, 0);
            j.rElbow.rotation.set(0, 0, 0);
            j.lElbow.rotation.set(0, 0, 0);
            j.rHip.rotation.set(0, 0, 0);
            j.lHip.rotation.set(0, 0, 0);
            j.rKnee.rotation.set(0, 0, 0);
            j.lKnee.rotation.set(0, 0, 0);

            // 미쿠 헤어 2차 흔들림 구현
            j.hairLeftPivot.rotation.z = Math.sin(t * 1.3) * 0.07;
            j.hairRightPivot.rotation.z = -Math.sin(t * 1.3) * 0.07;

            // --- 절차적 행동 상태 머신 수학 연산 연동 ---
            switch (b.type) {
                case 'squat_depth': // 다리 관절 깊게 구부리기 행동 집중 매핑
                    const waveSquat = (Math.sin(t) + 1) / 2; // 0에서 1 무한 루프
                    j.torso.position.y = 0.9 - (waveSquat * 0.32); // 바닥 기준 몸통 다운스케일링
                    
                    // 고관절 전방 회전 및 무릎 뒤쪽으로 깊게 완충 연산
                    j.rHip.rotation.x = waveSquat * b.legRange * 0.9;
                    j.lHip.rotation.x = waveSquat * b.legRange * 0.9;
                    j.rKnee.rotation.x = -waveSquat * b.legRange * 1.7; 
                    j.lKnee.rotation.x = -waveSquat * b.legRange * 1.7;
                    
                    // 팔을 앞으로 뻗어 균형 맞춤 연출
                    j.rShoulder.rotation.x = -waveSquat * 0.9;
                    j.lShoulder.rotation.x = -waveSquat * 0.9;
                    break;

                case 'natural_walk':
                    // 위상 변위값을 이용해 자연스러운 걷기 구현 (허우적거림 방지)
                    j.rShoulder.rotation.x = Math.sin(t) * b.armRange * 0.75;
                    j.lShoulder.rotation.x = -Math.sin(t) * b.armRange * 0.75;
                    
                    j.rHip.rotation.x = -Math.sin(t) * b.legRange * 0.9;
                    j.lHip.rotation.x = Math.sin(t) * b.legRange * 0.9;
                    
                    // 뒷다리 이탈 시 무릎이 역관절 없이 자연스럽게 꺾이도록 가이드
                    j.rKnee.rotation.x = (Math.sin(t) > 0 ? -Math.sin(t) : 0) * b.legRange * 1.1;
                    j.lKnee.rotation.x = (Math.sin(t) < 0 ? Math.sin(t) : 0) * b.legRange * 1.1;
                    
                    j.torso.position.y = 0.9 + Math.abs(Math.sin(t * 2)) * 0.025;
                    break;

                case 'dynamic_run':
                    // 속도감과 가동 반경을 최대로 확보한 질주 시뮬레이션
                    j.rShoulder.rotation.x = Math.sin(t) * b.armRange * 1.2;
                    j.lShoulder.rotation.x = -Math.sin(t) * b.armRange * 1.2;
                    j.rElbow.rotation.x = -0.4; 
                    j.lElbow.rotation.x = -0.4;

                    j.rHip.rotation.x = -Math.sin(t) * b.legRange * 1.2;
                    j.lHip.rotation.x = Math.sin(t) * b.legRange * 1.2;
                    j.rKnee.rotation.x = (Math.sin(t) > 0 ? -Math.sin(t) : 0) * b.legRange * 1.5;
                    j.lKnee.rotation.x = (Math.sin(t) < 0 ? Math.sin(t) : 0) * b.legRange * 1.5;

                    j.torso.position.y = 0.9 + Math.abs(Math.sin(t * 2)) * 0.07;
                    j.torso.rotation.x = 0.12; 
                    break;

                case 'idol_dance':
                    // 무대 안무 패턴 연출 구현
                    j.rShoulder.rotation.z = (Math.sin(t) * b.armRange * 0.8) + 0.5;
                    j.lShoulder.rotation.z = (-Math.cos(t) * b.armRange * 0.8) - 0.5;
                    j.rShoulder.rotation.x = Math.cos(t * 0.6) * b.armRange;
                    j.lShoulder.rotation.x = Math.sin(t * 0.6) * b.armRange;

                    j.rHip.rotation.z = Math.sin(t) * 0.12;
                    j.lHip.rotation.z = Math.sin(t) * 0.12;
                    j.rKnee.rotation.x = -Math.abs(Math.sin(t)) * b.legRange * 0.8;
                    j.lKnee.rotation.x = -Math.abs(Math.cos(t)) * b.legRange * 0.8;
                    break;

                case 'elegant_wave':
                    // 절제되면서도 가동 범위가 큰 손인사/웨이브 연출
                    j.rShoulder.rotation.z = 1.1 + Math.sin(t * 1.4) * 0.15; 
                    j.rElbow.rotation.z = Math.sin(t * 2.8) * 0.35; 
                    
                    j.lShoulder.rotation.z = -0.12 + Math.sin(t * 0.4) * 0.04; 
                    j.rHip.rotation.x = Math.sin(t) * 0.08;
                    break;

                case 'rhythm_jump':
                    // 도약 전 하체 충격 흡수 모션 결합형 점프
                    const waveJump = Math.sin(t);
                    if(waveJump < 0) { 
                        j.torso.position.y = 0.9 + (waveJump * 0.18);
                        j.rHip.rotation.x = -waveJump * b.legRange * 0.7;
                        j.lHip.rotation.x = -waveJump * b.legRange * 0.7;
                        j.rKnee.rotation.x = waveJump * b.legRange * 1.4;
                        j.lKnee.rotation.x = waveJump * b.legRange * 1.4;
                    } else { 
                        j.torso.position.y = 0.9 + (waveJump * 0.35);
                        j.rShoulder.rotation.z = 0.4;
                        j.lShoulder.rotation.z = -0.4;
                    }
                    break;
            }

            // --- 6. [핵심 제어 가드레일] 실시간 몸통 관통 완전 차단 로직 (Collision Constraint) ---
            // 오른팔 한계각 제어: Z축 회전 각도가 최소 안전 마진 이하로 좁혀져 몸통을 뚫는 사고 예방
            if (j.rShoulder.rotation.z < 0.08) {
                j.rShoulder.rotation.z = 0.08;
            }
            // 왼팔 한계각 제어: 대칭 방향의 마진 격리 벽 설정
            if (j.lShoulder.rotation.z > -0.08) {
                j.lShoulder.rotation.z = -0.08;
            }

            // X축 대반경 회전 운동 연동 시 겨드랑이 관통 교정 오프셋 확보
            if(Math.abs(j.rShoulder.rotation.x) > 0.4 && j.rShoulder.rotation.z < 0.18) {
                j.rShoulder.rotation.z = 0.18;
            }
            if(Math.abs(j.lShoulder.rotation.x) > 0.4 && j.lShoulder.rotation.z > -0.18) {
                j.lShoulder.rotation.z = -0.18;
            }

            // 생체 역학적 한계 보정 (팔꿈치 앞쪽 방향 고정 락 및 허우적거림 억제)
            if (b.type !== 'elegant_wave') { 
                j.rElbow.rotation.x = -Math.abs(Math.sin(t * 0.8 + b.phaseOffset)) * 0.6;
                j.lElbow.rotation.x = -Math.abs(Math.cos(t * 0.8 + b.phaseOffset)) * 0.6;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 7. 유연한 반응형 뷰포트 처리 (Resize Configuration) ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 엔진 초기 가동
        animate();
    </script>
</body>
</html>
