<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatsune Miku White Ver. - 500 Procedural Motions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #39c5bb;
        }
        #behavior-name {
            color: #39c5bb;
            font-weight: bold;
        }
    </style>
    <!-- Three.js 및 OrbitControls 라이브러리 CDN 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <div>하츠네 미쿠 (White Ver.) 모션 테스트</div>
        <div>현재 행동 패턴: <span id="behavior-name">Initializing...</span></div>
        <small style="color: #aaa;">3초마다 500가지 행동 중 하나로 무작위 전환됩니다.</small>
    </div>

    <script>
        // --- 1. 기본 씬 설정 (Scene, Camera, Renderer) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141414);
        scene.fog = new THREE.FogExp2(0x141414, 0.15);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 카메라 컨트롤러 (마우스 드래그로 회전, 휠로 줌 가능)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);

        // --- 2. 조명 설정 (Lights) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(20, 20, 0x39c5bb, 0x444444);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- 3. 미쿠 모델링 (White Ver. 구조 수정) ---
        function createMikuWhite() {
            const mikuGroup = new THREE.Group();

            // 재질 테마 (White 버전 기반)
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0d0, roughness: 0.5 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x39c5bb, roughness: 0.5 });
            const accentMat = new THREE.MeshStandardMaterial({ color: 0x39c5bb, roughness: 0.3 });

            // 몸통 (Torso) - 모든 관절의 중심점 기준축 역할
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 0.5, 16), whiteMat);
            torso.position.y = 0.85; 
            torso.castShadow = true;
            mikuGroup.add(torso);

            // 머리 (Head)
            const headGeo = new THREE.SphereGeometry(0.16, 16, 16);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 0.38;
            head.castShadow = true;
            torso.add(head);

            // 미쿠 트윈테일 머리카락 (좌/우)
            const hairLeftPivot = new THREE.Group();
            hairLeftPivot.position.set(-0.14, 0.08, -0.05);
            head.add(hairLeftPivot);
            const hairLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.01, 0.6, 8), hairMat);
            hairLeft.position.y = -0.28;
            hairLeft.rotation.z = Math.PI / 12;
            hairLeftPivot.add(hairLeft);

            const hairRightPivot = new THREE.Group();
            hairRightPivot.position.set(0.14, 0.08, -0.05);
            head.add(hairRightPivot);
            const hairRight = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.01, 0.6, 8), hairMat);
            hairRight.position.y = -0.28;
            hairRight.rotation.z = -Math.PI / 12;
            hairRightPivot.add(hairRight);

            // [오류 수정] 오른팔 구조화: 옷 레이어와 완전히 한 노드로 묶어 분리 현상 방지
            const rShoulder = new THREE.Group();
            rShoulder.position.set(0.22, 0.18, 0); // 몸통 어깨선에 정확히 밀착 고정
            torso.add(rShoulder);

            const rUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), whiteMat); // 소매 부분
            rUpperArm.position.y = -0.125;
            rUpperArm.castShadow = true;
            rShoulder.add(rUpperArm);

            const rElbow = new THREE.Group();
            rElbow.position.y = -0.125;
            rUpperArm.add(rElbow);

            const rLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.25, 8), skinMat); // 맨살/토시 부분
            rLowerArm.position.y = -0.125;
            rLowerArm.castShadow = true;
            rElbow.add(rLowerArm);

            // 왼팔 구조 (대칭 설계)
            const lShoulder = new THREE.Group();
            lShoulder.position.set(-0.22, 0.18, 0);
            torso.add(lShoulder);

            const lUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), whiteMat);
            lUpperArm.position.y = -0.125;
            lUpperArm.castShadow = true;
            lShoulder.add(lUpperArm);

            const lElbow = new THREE.Group();
            lElbow.position.y = -0.125;
            lUpperArm.add(lElbow);

            const lLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.25, 8), skinMat);
            lLowerArm.position.y = -0.125;
            lLowerArm.castShadow = true;
            lElbow.add(lLowerArm);

            // [기능 추가] 다리 관절 세분화 (고관절 - 무릎 구조 구축)
            // 오른다리
            const rHip = new THREE.Group();
            rHip.position.set(0.09, -0.25, 0);
            torso.add(rHip);

            const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.35, 8), whiteMat);
            rThigh.position.y = -0.175;
            rThigh.castShadow = true;
            rHip.add(rThigh);

            const rKnee = new THREE.Group();
            rKnee.position.y = -0.175;
            rThigh.add(rKnee);

            const rCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.35, 8), accentMat); // 미쿠 롱부츠 컨셉
            rCalf.position.y = -0.175;
            rCalf.castShadow = true;
            rKnee.add(rCalf);

            // 왼다리
            const lHip = new THREE.Group();
            lHip.position.set(-0.09, -0.25, 0);
            torso.add(lHip);

            const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.35, 8), whiteMat);
            lThigh.position.y = -0.175;
            lThigh.castShadow = true;
            lHip.add(lThigh);

            const lKnee = new THREE.Group();
            lKnee.position.y = -0.175;
            lThigh.add(lKnee);

            const lCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.35, 8), accentMat);
            lCalf.position.y = -0.175;
            lCalf.castShadow = true;
            lKnee.add(lCalf);

            return {
                mesh: mikuGroup,
                joints: {
                    torso, head, hairLeftPivot, hairRightPivot,
                    rShoulder, rElbow, lShoulder, lElbow,
                    rHip, rKnee, lHip, lKnee
                }
            };
        }

        const miku = createMikuWhite();
        scene.add(miku.mesh);

        // --- 4. 절차적 500가지 행동 데이터베이스 생성기 ---
        function generateBehaviors() {
            const db = [];
            const coreTypes = ['squat', 'walk', 'run', 'dance', 'idle_wave', 'active_jump'];
            
            for (let i = 0; i < 500; i++) {
                const type = coreTypes[i % coreTypes.length];
                db.push({
                    id: i,
                    name: `${type.toUpperCase()} (Pattern No.${String(i).padStart(3, '0')})`,
                    type: type,
                    // 기본 움직임 계수들에 미세 렌덤값을 주어 500가지가 모두 고유한 궤적을 갖게 만듦
                    speed: 1.8 + Math.sin(i * 0.45) * 0.6,
                    armRange: 0.5 + (i % 7) * 0.12,  // 확장된 관절 각도 (최대 약 1.3라디안까지 다이내믹하게)
                    legRange: 0.4 + (i % 5) * 0.15,  // 다리 관절 가동성 대폭 확장
                    phaseShift: (i % 12) * (Math.PI / 6)
                });
            }
            return db;
        }

        const behaviorDatabase = generateBehaviors();
        let currentBehavior = behaviorDatabase[0];
        let actionTimer = 0;
        const behaviorNameUI = document.getElementById('behavior-name');

        // --- 5. 실시간 애니메이션 연산 & 물리 예외 처리 (관통 방지) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            const j = miku.joints;
            const b = currentBehavior;
            const t = time * b.speed;

            // UI 텍스트 업데이트
            behaviorNameUI.innerText = b.name;

            // 3초 마다 자동으로 다음 패턴 무작위 전환 조절
            actionTimer += delta;
            if (actionTimer > 3.0) {
                currentBehavior = behaviorDatabase[Math.floor(Math.random() * 500)];
                actionTimer = 0;
            }

            // [초기화] 매 프레임 연산 전 본 구조를 표준 기준점으로 리셋
            j.torso.position.y = 0.85;
            j.torso.rotation.set(0, 0, 0);
            j.head.rotation.set(0, 0, 0);
            j.rShoulder.rotation.set(0, 0, 0);
            j.lShoulder.rotation.set(0, 0, 0);
            j.rElbow.rotation.set(0, 0, 0);
            j.lElbow.rotation.set(0, 0, 0);
            j.rHip.rotation.set(0, 0, 0);
            j.lHip.rotation.set(0, 0, 0);
            j.rKnee.rotation.set(0, 0, 0);
            j.lKnee.rotation.set(0, 0, 0);

            // 기본 머리카락 흔들림 효과 (자연스러운 서브 모션)
            j.hairLeftPivot.rotation.z = Math.sin(t * 1.5) * 0.08;
            j.hairRightPivot.rotation.z = -Math.sin(t * 1.5) * 0.08;

            // --- 500가지 절차적 행동 분기 처리 ---
            switch (b.type) {
                case 'squat': // 요청하신 다리 관절 굽히기 및 깊은 가동 범위 구현
                    const squatWeight = (Math.sin(t) + 1) / 2; // 0 ~ 1 바운스
                    j.torso.position.y = 0.85 - (squatWeight * 0.28); // 하강 깊이 증가
                    
                    // 고관절(Hip) 전방 회전 및 무릎(Knee) 역방향 깊은 스쿼트 매핑
                    j.rHip.rotation.x = squatWeight * b.legRange * 1.1;
                    j.lHip.rotation.x = squatWeight * b.legRange * 1.1;
                    j.rKnee.rotation.x = -squatWeight * b.legRange * 1.8; // 다리 깊게 굽힘
                    j.lKnee.rotation.x = -squatWeight * b.legRange * 1.8;
                    
                    // 중심을 잡기 위해 팔은 앞으로 길게 뻗음
                    j.rShoulder.rotation.x = -squatWeight * 1.0;
                    j.lShoulder.rotation.x = -squatWeight * 1.0;
                    break;

                case 'walk':
                    // 좌우 교차 위상차 피드백 (허우적거림 삭제, 정밀 걷기)
                    j.rShoulder.rotation.x = Math.sin(t) * b.armRange * 0.8;
                    j.lShoulder.rotation.x = -Math.sin(t) * b.armRange * 0.8;
                    
                    j.rHip.rotation.x = -Math.sin(t) * b.legRange;
                    j.lHip.rotation.x = Math.sin(t) * b.legRange;
                    
                    // 걸음걸이 시 뒤로 가기 직전 다리 관절 리얼타임 굽힘
                    j.rKnee.rotation.x = (Math.sin(t) > 0 ? -Math.sin(t) : 0) * b.legRange * 1.2;
                    j.lKnee.rotation.x = (Math.sin(t) < 0 ? Math.sin(t) : 0) * b.legRange * 1.2;
                    
                    j.torso.position.y = 0.85 + Math.abs(Math.sin(t * 2)) * 0.03;
                    break;

                case 'run':
                    // 역동적인 큰 각도의 달리기
                    j.rShoulder.rotation.x = Math.sin(t) * b.armRange * 1.3;
                    j.lShoulder.rotation.x = -Math.sin(t) * b.armRange * 1.3;
                    j.rElbow.rotation.x = -0.5; // 뛰기 편하게 기본 팔꿈치 기본 락 설정
                    j.lElbow.rotation.x = -0.5;

                    j.rHip.rotation.x = -Math.sin(t) * b.legRange * 1.3;
                    j.lHip.rotation.x = Math.sin(t) * b.legRange * 1.3;
                    j.rKnee.rotation.x = (Math.sin(t) > 0 ? -Math.sin(t) : 0) * b.legRange * 1.6;
                    j.lKnee.rotation.x = (Math.sin(t) < 0 ? Math.sin(t) : 0) * b.legRange * 1.6;

                    j.torso.position.y = 0.85 + Math.abs(Math.sin(t * 2)) * 0.08;
                    j.torso.rotation.x = 0.15; // 앞으로 살짝 숙인 상체
                    break;

                case 'dance':
                    // 가동 범위를 극한으로 써서 춤추는 무대 모션
                    j.rShoulder.rotation.z = (Math.sin(t) * b.armRange) + 0.4;
                    j.lShoulder.rotation.z = (-Math.cos(t) * b.armRange) - 0.4;
                    j.rShoulder.rotation.x = Math.cos(t * 0.5) * b.armRange;
                    j.lShoulder.rotation.x = Math.sin(t * 0.5) * b.armRange;

                    j.rHip.rotation.z = Math.sin(t) * 0.15;
                    j.lHip.rotation.z = Math.sin(t) * 0.15;
                    j.rKnee.rotation.x = -Math.abs(Math.sin(t)) * b.legRange;
                    j.lKnee.rotation.x = -Math.abs(Math.cos(t)) * b.legRange;
                    break;

                case 'idle_wave':
                    // 허우적거리지 않고 부드럽게 한 손 흔드는 아이돌식 제스처
                    j.rShoulder.rotation.z = 1.2 + Math.sin(t * 1.5) * 0.2; // 팔을 위로 고정
                    j.rElbow.rotation.z = Math.sin(t * 3) * 0.4; // 팔꿈치 아랫단 위상차 손흔들기
                    
                    j.lShoulder.rotation.z = -0.15 + Math.sin(t * 0.5) * 0.05; 
                    j.rHip.rotation.x = Math.sin(t) * 0.1;
                    break;

                case 'active_jump':
                    // 점프 뛰기 전 힘을 모아 무릎을 완충하는 콤플렉스 가동 모션
                    const jumpCycle = Math.sin(t);
                    if(jumpCycle < 0) { // 준비 동작 (무릎 크게 구부리기)
                        j.torso.position.y = 0.85 + (jumpCycle * 0.2);
                        j.rHip.rotation.x = -jumpCycle * b.legRange * 0.8;
                        j.lHip.rotation.x = -jumpCycle * b.legRange * 0.8;
                        j.rKnee.rotation.x = jumpCycle * b.legRange * 1.5;
                        j.lKnee.rotation.x = jumpCycle * b.legRange * 1.5;
                    } else { // 도약 순간 공중 연출
                        j.torso.position.y = 0.85 + (jumpCycle * 0.4);
                        j.rShoulder.rotation.y = -0.3;
                        j.lShoulder.rotation.y = 0.3;
                    }
                    break;
            }

            // --- 6. [핵심 제한장치] 몸통 관통 완전 방지 컬리전 필터 ---
            // 오른팔 제한: 어깨 Z축이 0.08 이하로 내려가면 몸통 메쉬를 침범하므로 최솟값 강제 차단
            if (j.rShoulder.rotation.z < 0.08) {
                j.rShoulder.rotation.z = 0.08;
            }
            // 왼팔 제한: 대칭축이므로 -0.08 이상으로 안쪽으로 파고드는 것을 벽으로 차단
            if (j.lShoulder.rotation.z > -0.08) {
                j.lShoulder.rotation.z = -0.08;
            }

            // 추가 관통 보정: X축 회전 반경이 클 때 내전 현상이 발생하지 않도록 Y축 보조 오프셋을 조절
            if(Math.abs(j.rShoulder.rotation.x) > 0.5 && j.rShoulder.rotation.z < 0.2) {
                j.rShoulder.rotation.z = 0.2;
            }
            if(Math.abs(j.lShoulder.rotation.x) > 0.5 && j.lShoulder.rotation.z > -0.2) {
                j.lShoulder.rotation.z = -0.2;
            }

            // 팔꿈치 역관절 꺾임 방지 (인체 해부학적 자연스러운 한계각 보정)
            if (b.type !== 'idle_wave') { 
                j.rElbow.rotation.x = -Math.abs(Math.sin(t * 0.8 + b.phaseShift)) * 0.7;
                j.lElbow.rotation.x = -Math.abs(Math.cos(t * 0.8 + b.phaseShift)) * 0.7;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 7. 창 크기 대응 반응형 윈도우 리사이즈 처리 ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 루프 실행
        animate();
    </script>
</body>
</html>
