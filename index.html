<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GundamTrainer AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Share+Tech+Mono&display=swap');

  :root {
    --miku-teal: #39c5bb;
    --miku-pink: #ff69b4;
    --miku-dark: #0a0e1a;
    --miku-darker: #060810;
    --miku-glow: rgba(57,197,187,0.4);
    --miku-panel: rgba(10,20,40,0.85);
    --text-main: #e0f7f5;
    --text-dim: rgba(224,247,245,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--miku-darker);
    color: var(--text-main);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── 배경 효과 ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 80%, rgba(57,197,187,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 20%, rgba(255,105,180,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── 헤더 ── */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid rgba(57,197,187,0.2);
    background: rgba(6,8,16,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px; height: 32px;
    border: 2px solid var(--miku-teal);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--miku-teal);
    box-shadow: 0 0 10px var(--miku-glow);
    animation: pulse-ring 3s infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 8px var(--miku-glow); }
    50% { box-shadow: 0 0 20px var(--miku-glow), 0 0 40px rgba(57,197,187,0.2); }
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--miku-teal);
    text-shadow: 0 0 20px var(--miku-glow);
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.2em;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--miku-teal);
    box-shadow: 0 0 8px var(--miku-teal);
    animation: blink 2s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── 메인 레이아웃 ── */
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ── 3D 캔버스 영역 ── */
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #canvas-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* 스캔라인 오버레이 */
  #canvas-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  /* 코너 장식 */
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    z-index: 5;
    pointer-events: none;
  }
  .corner.tl { top:12px; left:12px; border-top: 2px solid var(--miku-teal); border-left: 2px solid var(--miku-teal); }
  .corner.tr { top:12px; right:12px; border-top: 2px solid var(--miku-teal); border-right: 2px solid var(--miku-teal); }
  .corner.bl { bottom:12px; left:12px; border-bottom: 2px solid var(--miku-teal); border-left: 2px solid var(--miku-teal); }
  .corner.br { bottom:12px; right:12px; border-bottom: 2px solid var(--miku-teal); border-right: 2px solid var(--miku-teal); }

  /* 로딩 오버레이 */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--miku-darker);
    z-index: 20;
    gap: 20px;
    transition: opacity 0.8s;
  }

  #loading.hidden { opacity: 0; pointer-events: none; }

  .loading-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(57,197,187,0.2);
    border-top-color: var(--miku-teal);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--miku-teal);
    letter-spacing: 0.3em;
  }

  #loading-progress {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.2em;
  }

  /* ── 사이드 패널 (채팅) ── */
  #side-panel {
    width: 360px;
    display: flex;
    flex-direction: column;
    background: var(--miku-panel);
    border-left: 1px solid rgba(57,197,187,0.15);
    backdrop-filter: blur(16px);
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(57,197,187,0.1);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-title {
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--miku-teal);
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
  }

  /* ── 채팅 메시지 ── */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(57,197,187,0.3) transparent;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: msg-in 0.3s ease;
  }

  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.miku { align-items: flex-start; }

  .msg-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
  }

  .msg-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
  }

  .msg.user .msg-bubble {
    background: rgba(57,197,187,0.15);
    border: 1px solid rgba(57,197,187,0.3);
    border-bottom-right-radius: 2px;
    color: var(--text-main);
  }

  .msg.miku .msg-bubble {
    background: rgba(255,105,180,0.08);
    border: 1px solid rgba(255,105,180,0.2);
    border-bottom-left-radius: 2px;
    color: var(--text-main);
  }

  /* 입력 중 표시 */
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 8px 0;
    align-items: center;
  }

  .typing-indicator span {
    width: 5px; height: 5px;
    background: var(--miku-pink);
    border-radius: 50%;
    animation: bounce-dot 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce-dot {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── 하단 컨트롤 ── */
  #controls {
    padding: 16px;
    border-top: 1px solid rgba(57,197,187,0.1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #text-input-row {
    display: flex;
    gap: 8px;
  }

  #text-input {
    flex: 1;
    background: rgba(57,197,187,0.06);
    border: 1px solid rgba(57,197,187,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-main);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  #text-input:focus {
    border-color: var(--miku-teal);
    box-shadow: 0 0 12px rgba(57,197,187,0.15);
  }

  #text-input::placeholder { color: var(--text-dim); }

  .btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  #send-btn {
    padding: 10px 16px;
    background: var(--miku-teal);
    color: var(--miku-dark);
    font-weight: bold;
  }

  #send-btn:hover {
    background: #4dd9cf;
    box-shadow: 0 0 16px rgba(57,197,187,0.5);
  }

  #mic-btn {
    padding: 12px 20px;
    background: rgba(255,105,180,0.1);
    border: 1px solid rgba(255,105,180,0.3);
    color: var(--miku-pink);
    font-size: 13px;
  }

  #mic-btn:hover {
    background: rgba(255,105,180,0.2);
    box-shadow: 0 0 16px rgba(255,105,180,0.3);
  }

  #mic-btn.listening {
    background: var(--miku-pink);
    color: white;
    box-shadow: 0 0 20px rgba(255,105,180,0.6);
    animation: mic-pulse 1s infinite;
  }

  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 16px rgba(255,105,180,0.5); }
    50% { box-shadow: 0 0 30px rgba(255,105,180,0.9); }
  }

  .mic-hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.15em;
  }

  /* API 키 입력 */
  #api-key-section {
    padding: 12px;
    background: rgba(255,180,0,0.06);
    border: 1px solid rgba(255,180,0,0.2);
    border-radius: 8px;
  }

  #api-key-label {
    font-size: 9px;
    color: rgba(255,180,0,0.7);
    letter-spacing: 0.2em;
    font-family: 'Share Tech Mono', monospace;
    margin-bottom: 6px;
  }

  #api-key-row { display: flex; gap: 6px; }

  #api-key-input {
    flex: 1;
    background: rgba(255,180,0,0.05);
    border: 1px solid rgba(255,180,0,0.2);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    outline: none;
  }

  #api-key-save {
    padding: 7px 12px;
    background: rgba(255,180,0,0.15);
    border: 1px solid rgba(255,180,0,0.3);
    color: rgba(255,200,0,0.9);
    font-size: 10px;
    border-radius: 6px;
  }

  /* 모델 선택 */
  #model-select-row {
    display: flex;
    gap: 6px;
  }

  .model-btn {
    flex: 1;
    padding: 7px;
    background: rgba(57,197,187,0.05);
    border: 1px solid rgba(57,197,187,0.15);
    color: var(--text-dim);
    font-size: 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .model-btn.active {
    background: rgba(57,197,187,0.15);
    border-color: var(--miku-teal);
    color: var(--miku-teal);
  }

  /* 감정 표시 */
  #emotion-display {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    background: rgba(57,197,187,0.04);
    border: 1px solid rgba(57,197,187,0.1);
    border-radius: 8px;
  }

  #emotion-label {
    font-size: 9px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.15em;
    flex: 1;
  }

  #emotion-value {
    font-size: 11px;
    color: var(--miku-teal);
    font-family: 'Share Tech Mono', monospace;
  }

  /* 스크롤바 */
  #chat-messages::-webkit-scrollbar { width: 3px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: rgba(57,197,187,0.3); border-radius: 3px; }
</style>
</head>

      <div class="logo-text">GundamTrainer AI</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ── mmdparser 인라인 로드 및 종속성 순서 교정 ──
(function() {
  const scripts = [
    'https://unpkg.com/mmdparser@1.0.4/build/mmdparser.min.js', // 정식 안정화 주소로 변경하여 404 및 MIME 에러 해결
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/TGALoader.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MMDLoader.js'
  ];
  let idx = 0;
  function loadNext() {
    if (idx >= scripts.length) { window._mmdReady = true; return; }
    const s = document.createElement('script');
    s.src = scripts[idx++];
    s.crossOrigin = 'anonymous';
    s.onload = loadNext;
    s.onerror = () => { window._mmdFailed = true; };
    document.head.appendChild(s);
  }
  loadNext();
})();
</script>
<script>
// ══════════════════════════════════════
//  설정
// ══════════════════════════════════════
let GEMINI_API_KEY = '';
let currentModel = 'Black';
let isListening = false;
let recognition = null;
let scene, camera, renderer, mesh, clock;
let morphTargets = {};
let isSpeaking = false;
let currentEmotion = 'happy';

const EMOTIONS = {
  happy:   { emoji: '😊', morph: { 'にっこり': 0.8, '笑い': 0.5 } },
  sad:     { emoji: '😢', morph: { '困る': 0.7, '悲しい': 0.6 } },
  angry:   { emoji: '😠', morph: { '怒り': 0.8 } },
  surprised:{ emoji: '😲', morph: { '驚기': 0.9 } },
  neutral: { emoji: '😐', morph: {} },
};

// ══════════════════════════════════════
//  API 키 관리
// ══════════════════════════════════════
function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (val) {
    GEMINI_API_KEY = val;
    document.getElementById('api-key-section').style.borderColor = 'rgba(57,197,187,0.4)';
    document.getElementById('api-key-label').textContent = '✓ API KEY SAVED';
    document.getElementById('api-key-label').style.color = 'rgba(57,197,187,0.8)';
    addMessage('system', 'API 키가 저장됐어요! 이제 미쿠와 대화할 수 있어요 🎵');
  }
}

// ══════════════════════════════════════
//  Three.js 초기화
// ══════════════════════════════════════
function initThree() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth;
  const h = container.clientHeight;

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  // 배경 그라데이션 효과 (조명으로 표현)
  const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0x39c5bb, 1.2);
  dirLight.position.set(1, 2, 3);
  scene.add(dirLight);

  const rimLight = new THREE.DirectionalLight(0xff69b4, 0.4);
  rimLight.position.set(-2, 1, -2);
  scene.add(rimLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
  fillLight.position.set(0, -1, 2);
  scene.add(fillLight);

  // Camera
  camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 100);
  camera.position.set(0, 12, 20);
  camera.lookAt(0, 10, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // 리사이즈 처리
  window.addEventListener('resize', () => {
    const nw = container.clientWidth;
    const nh = container.clientHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });

  loadMMDModel();
}

// ══════════════════════════════════════
//  MMD 모델 로드
// ══════════════════════════════════════
function loadMMDModel() {
  // MMDLoader 준비될 때까지 대기 (최대 10초)
  let waited = 0;
  const check = setInterval(() => {
    waited += 200;
    if (window._mmdFailed || waited > 10000) {
      clearInterval(check);
      showFallbackMiku();
      return;
    }
    if (window._mmdReady && typeof THREE.MMDLoader !== 'undefined') {
      clearInterval(check);
      startMMDLoad();
    }
  }, 200);
}

function startMMDLoad() {
  if (typeof THREE.MMDLoader === 'undefined') {
    showFallbackMiku();
    return;
  }

  const loader = new THREE.MMDLoader();
  // GitHub Pages에서 PMX 로드 (같은 origin이라 CORS 없음)
  const modelFile = `./${currentModel}.pmx`;

  // 텍스처 경로도 같은 폴더로
  loader.load(
    modelFile,
    (object) => {
      if (mesh) scene.remove(mesh);
      mesh = object;
      mesh.position.set(0, 0, 0);
      mesh.scale.set(0.1, 0.1, 0.1); // PMX 단위 조정
      scene.add(mesh);

      collectMorphTargets();
      hideLoading();
      document.getElementById('status-text').textContent = 'ONLINE';
      animate();
    },
    (progress) => {
      if (progress.total > 0) {
        const pct = Math.round(progress.loaded / progress.total * 100);
        document.getElementById('loading-progress').textContent = `${pct}%`;
      }
    },
    (error) => {
      console.warn('MMD load failed:', error);
      showFallbackMiku();
    }
  );
}

function collectMorphTargets() {
  if (!mesh) return;
  mesh.traverse((child) => {
    if (child.isMesh && child.morphTargetDictionary) {
      Object.assign(morphTargets, child.morphTargetDictionary);
    }
  });
}

function hideLoading() {
  const el = document.getElementById('loading');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => el.remove(), 1000);
  }
}

// ══════════════════════════════════════
//  애니메이션 루프
// ══════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const delta = clock ? clock.getDelta() : 0.016;
  const time = clock ? clock.getElapsedTime() : 0;

  if (mesh) {
    // 자연스러운 흔들림
    mesh.rotation.y = Math.sin(time * 0.3) * 0.05;
    mesh.position.y = Math.sin(time * 0.5) * 0.15;

    // 말하는 중 입 애니메이션
    if (isSpeaking) {
      setMorph('あ', Math.abs(Math.sin(time * 8)) * 0.7);
    } else {
      setMorph('あ', 0);
    }

    // 눈 깜빡임
    if (Math.floor(time * 10) % 40 === 0) {
      setMorph('まばたき', 1);
    } else if (Math.floor(time * 10) % 40 === 2) {
      setMorph('まばたき', 0);
    }
  }

  renderer.render(scene, camera);
}

function setMorph(name, value) {
  if (!mesh) return;
  mesh.traverse((child) => {
    if (child.isMesh && child.morphTargetDictionary && child.morphTargetInfluences) {
      const idx = child.morphTargetDictionary[name];
      if (idx !== undefined) {
        child.morphTargetInfluences[idx] = value;
      }
    }
  });
}

function applyEmotion(emotionKey) {
  if (!EMOTIONS[emotionKey]) return;
  currentEmotion = emotionKey;
  const e = EMOTIONS[emotionKey];
  document.getElementById('emotion-value').textContent = `${e.emoji} ${emotionKey.toUpperCase()}`;

  // 기존 표정 초기화
  ['にっこり','笑い','困る','悲しい','怒り','驚き'].forEach(m => setMorph(m, 0));
  // 새 표정 적용
  Object.entries(e.morph).forEach(([name, val]) => {
    setMorph(name, val);
  });
}

// ══════════════════════════════════════
//  채팅 UI
// ══════════════════════════════════════
function addMessage(role, text) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');

  if (role === 'system') {
    div.className = 'msg miku';
    div.innerHTML = `<div class="msg-label">SYSTEM</div><div class="msg-bubble" style="border-color:rgba(255,180,0,0.3);background:rgba(255,180,0,0.06);white-space:pre-line">${text}</div>`;
  } else if (role === 'user') {
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-label">YOU</div><div class="msg-bubble">${text}</div>`;
  } else {
    div.className = 'msg miku';
    div.innerHTML = `<div class="msg-label">初音ミク</div><div class="msg-bubble">${text}</div>`;
  }

  container.appendChild(div);

}

function showTyping() {
  const container = document.getElementById('chat-messages');

  div.className = 'msg miku';
  div.id = 'typing-bubble';
  div.innerHTML = `<div class="msg-label">初音ミク</div><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;

  container.scrollTop = container.scrollHeight;
}

function removeTyping() {

}

// ══════════════════════════════════════
//  Gemini API 호출
// ══════════════════════════════════════
async function callGemini(userText) {
  if (!GEMINI_API_KEY) {
    return '먼저 Gemini API 키를 입력해주세요! 위의 API KEY 칸에 넣으면 돼요 🎵';
  }

  const systemPrompt = `너는 하츠네 미쿠야. 귀엽고 밝고 노래를 좋아하는 버추얼 아이돌이야.
반드시 한국어로만 대화해. 일본어는 절대 쓰지 마.
짧고 친근하게 대답해. 이모지도 가끔 써. 음악이나 노래 관련 얘기를 좋아해.
답변 마지막에 반드시 감정 태그를 붙여: [EMOTION:happy] [EMOTION:sad] [EMOTION:angry] [EMOTION:surprised] [EMOTION:neutral] 중 하나.`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: `${systemPrompt}\n\n사용자: ${userText}` }]
          }]
        })
      }
    );

    if (!res.ok) {
      const err = await res.json();
      if (err.error?.status === 'INVALID_ARGUMENT') return 'API 키가 잘못됐어요! 다시 확인해주세요 😢';
      if (err.error?.status === 'RESOURCE_EXHAUSTED') return 'API 할당량이 초과됐어요. 잠시 후 다시 시도해주세요!';
      return `오류가 발생했어요: ${err.error?.message || 'Unknown error'}`;
    }

    const data = await res.json();
    let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '...';

    // 감정 추출
    const emotionMatch = reply.match(/\[EMOTION:(\w+)\]/);
    if (emotionMatch) {
      applyEmotion(emotionMatch[1]);
      reply = reply.replace(/\[EMOTION:\w+\]/g, '').trim();
    }

    return reply;
  } catch (e) {
    return `연결 오류: ${e.message}`;
  }
}

// ══════════════════════════════════════
//  메시지 전송
// ══════════════════════════════════════
async function sendMessage(text) {
  const input = document.getElementById('text-input');
  const msg = text || input.value.trim();
  if (!msg) return;

  input.value = '';
  addMessage('user', msg);
  showTyping();

  const reply = await callGemini(msg);
  removeTyping();
  addMessage('miku', reply);
  speak(reply);
}

// ══════════════════════════════════════
//  Web Speech API - TTS (한국어 고정)
// ══════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;

  // 이모지, 일본어/한자, 특수문자 제거 → 한국어만 읽기
  const clean = text
    .replace(/[\u{1F300}-\u{1FFFF}]/gu, '')
    .replace(/[\u3000-\u9fff]/g, '')
    .replace(/[♪♫★☆]/g, '')
    .trim();

  if (!clean) return;

  const utter = new SpeechSynthesisUtterance(clean);

  // 한국어 목소리만 선택
  const voices = speechSynthesis.getVoices();
  const koVoice =
    voices.find(v => v.lang === 'ko-KR' && /female|yuna|나나|미진/i.test(v.name)) ||
    voices.find(v => v.lang === 'ko-KR') ||
    voices.find(v => v.lang.startsWith('ko'));

  if (koVoice) utter.voice = koVoice;
  utter.lang = 'ko-KR';
  utter.pitch = 1.4;
  utter.rate = 1.05;

  utter.onstart = () => { isSpeaking = true; };
  utter.onend   = () => { isSpeaking = false; setMorph('あ', 0); };

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// ══════════════════════════════════════
//  Web Speech API - STT
// ══════════════════════════════════════
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('이 브라우저는 음성인식을 지원하지 않아요. Chrome을 써주세요!');
    return;
  }

  if (isListening) {
    recognition?.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = true;
  recognition.continuous = false;

  const micBtn = document.getElementById('mic-btn');
  const micHint = document.getElementById('mic-hint');

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '🔴 듣는 중...';
    micHint.textContent = '말이 끝나면 자동으로 전송돼요';
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript).join('');
    document.getElementById('text-input').value = transcript;
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 마이크로 말하기';
    micHint.textContent = '클릭하면 음성인식 시작';

    const val = document.getElementById('text-input').value.trim();
    if (val) sendMessage(val);
  };

  recognition.onerror = (e) => {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 마이크로 말하기';
    if (e.error === 'not-allowed') {
      micHint.textContent = '마이크 권한을 허용해주세요!';
    }
  };

  recognition.start();
}
